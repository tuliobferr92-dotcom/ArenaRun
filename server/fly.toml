# Fly.io config for the REINOS relay server. Deploy from the REPO ROOT
# (not from server/) since the Dockerfile needs ../packages/reinos_engine
# in its build context:
#   fly launch --copy-config --no-deploy   (first time, from repo root)
#   fly deploy --config server/fly.toml --dockerfile server/Dockerfile .
app = "reinos-server"
primary_region = "gru" # São Paulo — change to whatever region is closest to most players

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
